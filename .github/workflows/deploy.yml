name: CI/CD

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          npm run bootstrap

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Deploy to Firebase (Dev)
        if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_DEV_TOKEN }}
        # Project IDs are kept out of the repo (public GitHub); set them as
        # repo/environment secrets instead of hardcoding them here.
        run: npx firebase-tools deploy -f --project "${{ secrets.FIREBASE_DEV_PROJECT_ID }}" --token "$FIREBASE_TOKEN"

      - name: Deploy to Firebase (Prod)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_PROD_TOKEN }}
        run: npx firebase-tools deploy -f --project "${{ secrets.FIREBASE_PROD_PROJECT_ID }}" --token "$FIREBASE_TOKEN"
