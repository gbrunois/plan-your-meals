name: CI/CD

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  # Runs on every push and PR, without any secret (PRs, e.g. Dependabot's,
  # don't get them).
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade npm (the one bundled with Node 22 crashes on our lockfile)
        run: npm install -g npm@11

      - name: Install dependencies
        run: |
          npm install
          npm run bootstrap

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # Opens/updates the "release PR" (version bump + CHANGELOG from conventional
  # commits) on every push to master. Merging that PR creates the tag + GitHub
  # release, and `release_created` then unlocks the prod deploy below. Kept in
  # this workflow (rather than a separate `on: release` one) because releases
  # created with GITHUB_TOKEN don't trigger other workflows.
  release-please:
    needs: verify
    if: github.event_name == 'push' && github.ref_name == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The release commit only exists on master, so once a release is created,
  # opens a master -> develop PR to bring it back (nothing happens if develop
  # already has it or such a PR is open). It must be merged with a *merge commit* (squash/rebase would rewrite the SHAs
  # and make the branches diverge). PRs opened with GITHUB_TOKEN don't trigger
  # workflows, so checks won't run on it.
  sync-develop:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Open master -> develop PR if develop is behind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          behind=$(git rev-list --count origin/develop..origin/master)
          if [ "$behind" = "0" ]; then
            echo "develop is up to date"
            exit 0
          fi
          if [ -n "$(gh pr list --base develop --head master --state open --json number --jq '.[].number')" ]; then
            echo "sync PR already open"
            exit 0
          fi
          gh pr create --base develop --head master \
            --title "chore: sync master into develop" \
            --body "develop is $behind commit(s) behind master. Merge with a **merge commit** (not squash/rebase) so both branches keep the same history."

  # push on develop -> `dev` environment, release created on master -> `prod`. Each
  # GitHub environment holds the same secret names, with that project's values:
  #   FIREBASERC      content of .firebaserc (has both aliases)
  #   FRONT_ENV       content of packages/front/.env.<development|production>
  #   FUNCTIONS_ENV   content of packages/functions/.env.<dev|prod>
  #   FIREBASE_TOKEN  firebase login:ci token
  # The env files are gitignored (public repo), so they are rebuilt from the
  # secrets before building.
  deploy:
    needs: [verify, release-please]
    if: >-
      always() && needs.verify.result == 'success' &&
      github.event_name == 'push' &&
      (github.ref_name == 'develop' ||
      needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'prod' || 'dev' }}
    env:
      FIREBASE_ALIAS: ${{ github.ref_name == 'master' && 'prod' || 'dev' }}
      VITE_MODE: ${{ github.ref_name == 'master' && 'production' || 'development' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade npm (the one bundled with Node 22 crashes on our lockfile)
        run: npm install -g npm@11

      - name: Install dependencies
        run: |
          npm install
          npm run bootstrap

      - name: Restore env files
        env:
          FIREBASERC: ${{ secrets.FIREBASERC }}
          FRONT_ENV: ${{ secrets.FRONT_ENV }}
          FUNCTIONS_ENV: ${{ secrets.FUNCTIONS_ENV }}
        run: |
          printf '%s' "$FIREBASERC" > .firebaserc
          printf '%s' "$FRONT_ENV" > "packages/front/.env.$VITE_MODE"
          printf '%s' "$FUNCTIONS_ENV" > "packages/functions/.env.$FIREBASE_ALIAS"

      - name: Build
        run: |
          npm run build -w @plan-your-meals/front -- --mode "$VITE_MODE"
          npm run build -w @plan-your-meals/functions

      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx firebase-tools deploy -f --project "$FIREBASE_ALIAS" --token "$FIREBASE_TOKEN"
